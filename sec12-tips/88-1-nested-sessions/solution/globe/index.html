<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 고령화 지구본</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #0b1020; --surface: #141a2e; --text: #e8ecf5; --muted: #8a93ab; --accent: #ff8a3d;
    --line: rgba(232, 236, 245, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  #app { position: relative; width: 100vw; height: 100vh; }
  #globe { position: absolute; inset: 0; }

  header { position: absolute; top: 24px; left: 28px; pointer-events: none; max-width: 60%; }
  header { text-shadow: 0 2px 8px #000, 0 0 2px #000; }
  h1 { margin: 0; font-size: clamp(22px, 2.6vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
  h1 .yr { color: var(--accent); }
  .sub { margin-top: 6px; color: var(--muted); font-size: clamp(14px, 1.2vw, 18px); }

  .panel { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
    border-radius: 16px; backdrop-filter: blur(8px); }
  aside { position: absolute; top: 24px; right: 24px; width: clamp(260px, 24vw, 360px); padding: 18px 20px;
    max-height: calc(100vh - 170px); overflow: auto; }
  aside h2 { margin: 0 0 10px; font-size: 18px; font-weight: 700; }
  ol { list-style: none; margin: 0; padding: 0; }
  ol li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 8px 6px;
    border-radius: 8px; cursor: pointer; font-size: 17px; }
  ol li:hover { background: rgba(255, 255, 255, 0.06); }
  ol li .rk { color: var(--muted); font-variant-numeric: tabular-nums; }
  ol li .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  ol li.hl .nm { color: var(--accent); font-weight: 700; }

  .focus { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1a0e05; border-color: var(--accent); }
  .focus button { flex: 1; }

  #info { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); min-height: 64px; }
  #info .nm { font-size: 20px; font-weight: 700; }
  #info .big { font-size: 34px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  #info .muted { color: var(--muted); font-size: 15px; }

  .timeline { position: absolute; left: 24px; right: 24px; bottom: 44px; padding: 14px 20px;
    display: flex; align-items: center; gap: 18px; }
  .timeline input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .timeline .yr { font-size: 28px; font-weight: 800; min-width: 72px; text-align: center; font-variant-numeric: tabular-nums; }
  .legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .legend .bar { width: 120px; height: 10px; border-radius: 5px; }

  footer { position: absolute; left: 28px; bottom: 14px; color: var(--muted); font-size: 13px; }

  .tip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-family: Pretendard, system-ui, sans-serif; color: var(--text); font-size: 15px; line-height: 1.4; }
  .tip b { font-size: 17px; }
  .tip .v { color: var(--accent); font-size: 20px; font-weight: 800; }

  .tag { color: var(--accent); font-weight: 800; font-size: 16px; text-shadow: 0 1px 3px #000, 0 0 8px #000;
    transform: translate(-50%, -130%); white-space: nowrap; pointer-events: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 18px; pointer-events: none; }

  @media (max-height: 720px) {
    ol li { padding: 4px 6px; font-size: 15px; }
    #info .big { font-size: 26px; }
    aside { padding: 14px 16px; }
  }
  @media (max-width: 760px) {
    header { max-width: none; right: 16px; left: 16px; top: 16px; }
    aside { top: auto; bottom: 120px; left: 16px; right: 16px; width: auto; max-height: 34vh; }
    .timeline { left: 16px; right: 16px; bottom: 36px; gap: 10px; padding: 10px 12px; }
    .legend { display: none; }
    footer { left: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="globe"></div>
  <div id="status">데이터를 불러오는 중…</div>

  <header>
    <h1>세계 65세 이상 인구 비율 · <span class="yr" id="titleYear">2023</span>년</h1>
    <div class="sub">기둥 높이와 색 = 전체 인구 중 65세 이상 비율(%) · 마우스를 올리거나 클릭해 보세요</div>
  </header>

  <aside class="panel">
    <h2>상위 10개국</h2>
    <ol id="top10"></ol>
    <div class="focus">
      <button data-iso="KOR">한국</button>
      <button data-iso="JPN">일본</button>
      <button data-iso="USA">미국</button>
    </div>
    <div id="info"><span class="muted">국가를 선택하면 상세 값이 표시됩니다.</span></div>
  </aside>

  <div class="timeline panel">
    <button id="play" aria-label="재생">▶ 재생</button>
    <input id="year" type="range" min="1990" max="2023" step="1" value="2023" aria-label="연도">
    <div class="yr" id="yearLabel">2023</div>
    <div class="legend"><span>0%</span><span class="bar" id="legendBar"></span><span>30%+</span></div>
  </div>

  <footer>출처: World Bank, SP.POP.65UP.TO.ZS</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.32.4/dist/globe.gl.min.js"></script>
<script>
(async () => {
  const MIN_YEAR = 1990, MAX_YEAR = 2023, SCALE_MAX = 30;
  const FOCUS = ['KOR', 'JPN', 'USA'];
  const STOPS = ['#2b6cb0', '#38b2ac', '#f6e05e', '#ff8a3d', '#e53e3e'];

  const $ = (id) => document.getElementById(id);
  const regionNames = new Intl.DisplayNames(['ko'], { type: 'region' });

  const [popRes, ctyRes] = await Promise.all([fetch('../data/pop65.json'), fetch('../data/countries.json')]);
  const [, popRows] = await popRes.json();
  const [, countryRows] = await ctyRes.json();

  const countries = new Map();
  for (const c of countryRows) {
    if (c.region.value === 'Aggregates' || !c.latitude || !c.longitude) continue;
    let name = c.name;
    try { name = regionNames.of(c.iso2Code) || c.name; } catch (_) {}
    countries.set(c.id, { iso3: c.id, name, lat: +c.latitude, lng: +c.longitude, values: {} });
  }
  for (const r of popRows) {
    const c = countries.get(r.countryiso3code);
    if (c && r.value != null) c.values[r.date] = r.value;
  }
  const points = [...countries.values()].filter((c) => Object.keys(c.values).length);

  const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const colorFor = (v) => {
    const t = Math.min(Math.max(v / SCALE_MAX, 0), 1) * (STOPS.length - 1);
    const i = Math.min(Math.floor(t), STOPS.length - 2), f = t - i;
    const a = hexToRgb(STOPS[i]), b = hexToRgb(STOPS[i + 1]);
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  };
  $('legendBar').style.background = `linear-gradient(90deg, ${STOPS.join(',')})`;

  let year = MAX_YEAR;
  let selected = null;
  const valueOf = (d) => d.values[year];
  const fmt = (v) => v.toFixed(1) + '%';

  const el = $('globe');
  const globe = Globe()(el)
    .backgroundColor('#0b1020')
    .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-night.jpg')
    .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.1/example/img/earth-topology.png')
    .showAtmosphere(true).atmosphereColor('#6b8cff').atmosphereAltitude(0.18)
    .pointLat('lat').pointLng('lng')
    .pointAltitude((d) => (valueOf(d) ?? 0) / 90)
    .pointRadius((d) => (FOCUS.includes(d.iso3) || d === selected ? 0.75 : 0.45))
    .pointColor((d) => (valueOf(d) == null ? 'rgba(0,0,0,0)' : colorFor(valueOf(d))))
    .pointResolution(12)
    .pointsMerge(false)
    .pointsTransitionDuration(600)
    .pointLabel((d) => {
      const v = valueOf(d);
      return `<div class="tip"><b>${d.name}</b><br>${v == null ? '데이터 없음' : `<span class="v">${fmt(v)}</span>`}<br>${year}년 · 65세 이상 비율</div>`;
    })
    .onPointClick((d) => select(d, true))
    .htmlLat((t) => t.src.lat).htmlLng((t) => t.src.lng)
    .htmlAltitude((t) => (valueOf(t.src) ?? 0) / 90 + 0.02)
    .htmlElement((t) => {
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = t.src.name;
      return tag;
    })
    .htmlTransitionDuration(600)
    .pointsData(points)
    .htmlElementsData(FOCUS.map((iso) => ({ src: countries.get(iso) }))); // separate objects: globe.gl binds per-layer state onto data items

  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.35;
  globe.pointOfView({ lat: 30, lng: 115, altitude: 2.2 }, 0);
  el.addEventListener('pointerdown', () => { globe.controls().autoRotate = false; });

  const resize = () => globe.width(window.innerWidth).height(window.innerHeight);
  window.addEventListener('resize', resize);
  resize();

  function select(d, fly) {
    selected = d;
    globe.controls().autoRotate = false;
    if (fly) globe.pointOfView({ lat: d.lat - 22, lng: d.lng, altitude: 1.7 }, 1200);
    document.querySelectorAll('.focus button').forEach((b) => b.classList.toggle('on', b.dataset.iso === d.iso3));
    globe.pointRadius(globe.pointRadius());
    renderInfo();
  }

  function renderInfo() {
    if (!selected) return;
    const v = valueOf(selected);
    const v90 = selected.values[MIN_YEAR];
    const delta = v != null && v90 != null ? `${MIN_YEAR}년 ${fmt(v90)} → ${year}년 (${v - v90 >= 0 ? '+' : ''}${(v - v90).toFixed(1)}%p)` : '';
    const rank = ranked().findIndex((d) => d === selected) + 1;
    $('info').innerHTML = `<div class="nm">${selected.name}</div>
      <div class="big">${v == null ? '데이터 없음' : fmt(v)}</div>
      <div class="muted">${year}년${rank ? ` · ${ranked().length}개국 중 ${rank}위` : ''}</div>
      <div class="muted">${delta}</div>`;
  }

  const ranked = () => points.filter((d) => valueOf(d) != null).sort((a, b) => valueOf(b) - valueOf(a));

  function renderTop10() {
    const list = $('top10');
    list.innerHTML = '';
    ranked().slice(0, 10).forEach((d, i) => {
      const li = document.createElement('li');
      if (FOCUS.includes(d.iso3)) li.className = 'hl';
      li.innerHTML = `<span class="rk">${i + 1}</span><span class="nm">${d.name}</span><span class="v">${fmt(valueOf(d))}</span>`;
      li.addEventListener('click', () => select(d, true));
      list.appendChild(li);
    });
  }

  function setYear(y) {
    year = y;
    $('year').value = y;
    $('yearLabel').textContent = y;
    $('titleYear').textContent = y;
    globe.pointAltitude(globe.pointAltitude()).pointColor(globe.pointColor())
      .htmlAltitude(globe.htmlAltitude());
    renderTop10();
    renderInfo();
  }

  $('year').addEventListener('input', (e) => { stop(); setYear(+e.target.value); });

  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $('play').textContent = '▶ 재생'; };
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    if (year >= MAX_YEAR) setYear(MIN_YEAR);
    $('play').textContent = '❚❚ 정지';
    timer = setInterval(() => (year >= MAX_YEAR ? stop() : setYear(year + 1)), 700);
  });

  document.querySelectorAll('.focus button').forEach((b) =>
    b.addEventListener('click', () => select(countries.get(b.dataset.iso), true)));

  setYear(MAX_YEAR);
  $('status').remove();
  window.__globe = { globe, countries, points, get year() { return year; } };
})().catch((err) => {
  document.getElementById('status').textContent = '데이터를 불러오지 못했습니다. 프로젝트 루트에서 python3 -m http.server 로 열어 주세요.';
  console.error(err);
});
</script>
</body>
</html>
