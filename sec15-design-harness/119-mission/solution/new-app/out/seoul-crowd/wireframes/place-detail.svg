<rect x="8" y="60" width="374" height="88" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="5"/>
<text x="20" y="82" font-size="13" font-family="sans-serif" fill="#111">1. 현재 혼잡 단계 + 인구 범위</text>
