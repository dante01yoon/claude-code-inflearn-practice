<text x="20" y="550" font-size="12" font-family="sans-serif" fill="#555">남 53.4% 여 46.6% | 거주 26.2% 비거주 73.8% | 연령대 8구간(%</text>
<rect x="8" y="684" width="374" height="48" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="706" font-size="13" font-family="sans-serif" fill="#111">6. 상태 안내(불러오는 중/오류/데이터 없음)</text>
