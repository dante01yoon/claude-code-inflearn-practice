<text x="20" y="198" font-size="12" font-family="sans-serif" fill="#555">사람이 몰려있을 가능성이 낮고 붐빔은 거의 느껴지지 않아요.</text>
<rect x="8" y="228" width="374" height="216" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="3"/>
