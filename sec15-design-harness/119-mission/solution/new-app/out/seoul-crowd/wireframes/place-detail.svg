<text x="20" y="270" font-size="12" font-family="sans-serif" fill="#555">기준 21:30, 첫 예측 23:00(90분 뒤). 10:00만 보통 32,000~34</text>
<rect x="8" y="452" width="374" height="48" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="2"/>
