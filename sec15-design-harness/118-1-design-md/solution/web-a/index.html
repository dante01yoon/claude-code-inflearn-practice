<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>따릉이 대여소 현황</title>
<style>
  :root {
    /* semantic color (DESIGN.md) */
    --color-brand: #0A6B47;
    --color-brand-soft: #E8F3EE;
    --color-on-brand: #FFFFFF;
    --color-zero: #B3261E;
    --color-zero-soft: #FDEEEC;
    --color-low: #8A4B00;
    --color-low-soft: #FFF3E0;
    --color-text: #191F28;
    --color-text-muted: #4E5968;
    --color-surface: #FFFFFF;
    --color-surface-muted: #F2F4F6;
    --color-border: #E5E8EB;

    --font-base: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    --font-size-caption: 13px;
    --font-size-sub: 15px;
    --font-size-body: 17px;
    --font-size-title: 22px;
    --font-size-headline: 28px;
    --font-size-display: 40px;
    --font-weight-regular: 400;
    --font-weight-medium: 500;
    --font-weight-bold: 700;
    --line-height-body: 1.5;
    --line-height-tight: 1.3;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;

    --size-touch: 44px;
    --size-header: 56px;
    --size-row: 72px;
    --size-zero-bar: 4px;
    --size-summary: 64px;
    --size-searchbar: 48px;

    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-pill: 24px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font-base);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
    color: var(--color-text);
    background: var(--color-surface-muted);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--color-surface);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  :focus-visible { outline: 2px solid var(--color-brand); outline-offset: 2px; }

  /* AppBar */
  .app-bar {
    position: sticky; top: 0; z-index: 1;
    height: var(--size-header);
    padding: 0 var(--space-4);
    display: flex; align-items: center; gap: var(--space-2);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .app-bar h1 {
    margin: 0;
    font-size: var(--font-size-title);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
  }

  /* BackButton */
  .back-button {
    min-width: var(--size-touch); height: var(--size-touch);
    margin-left: calc(var(--space-2) * -1);
    padding: 0 var(--space-2);
    display: inline-flex; align-items: center; gap: var(--space-1);
    border: 0; background: none; cursor: pointer;
    color: var(--color-brand);
    font-size: var(--font-size-body);
    font-weight: var(--font-weight-medium);
    border-radius: var(--radius-md);
  }

  /* 목록 상단 */
  .list-head { padding: var(--space-4) var(--space-4) var(--space-3); }
  .list-head-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2);
  }
  .list-count {
    margin: 0;
    font-size: var(--font-size-body);
    font-weight: var(--font-weight-bold);
  }
  .freshness {
    font-size: var(--font-size-caption);
    color: var(--color-text-muted);
  }

  /* SummaryCard */
  .summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .summary-card {
    height: var(--size-summary);
    padding: 0 var(--space-3);
    display: flex; flex-direction: column; justify-content: center;
    background: var(--color-surface-muted);
    border-radius: var(--radius-lg);
  }
  .summary-card .label {
    font-size: var(--font-size-caption);
    color: var(--color-text-muted);
    line-height: var(--line-height-tight);
  }
  .summary-card .value {
    font-size: var(--font-size-title);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
  }
  .summary-card.zero .value { color: var(--color-zero); }

  /* SearchBar */
  .search {
    position: relative;
    margin-top: var(--space-3);
  }
  .search input {
    width: 100%;
    height: var(--size-searchbar);
    padding: 0 var(--size-touch) 0 var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    font: inherit;
    font-size: var(--font-size-body);
    color: var(--color-text);
  }
  .search input::placeholder { color: var(--color-text-muted); }
  .search input:focus { outline: none; border-color: var(--color-brand); }
  .search input::-webkit-search-cancel-button { display: none; }
  .clear-search {
    position: absolute; right: 2px; top: 2px;
    width: var(--size-touch); height: var(--size-touch);
    border: 0; background: none; cursor: pointer;
    color: var(--color-text-muted);
    border-radius: var(--radius-pill);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .clear-search[hidden] { display: none; }

  /* StationRow */
  .station-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-border); }
  .station-row {
    position: relative;
    width: 100%;
    min-height: var(--size-row);
    padding: var(--space-2) var(--space-4);
    display: flex; align-items: center; gap: var(--space-3);
    border: 0; border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
    text-align: left; text-decoration: none; cursor: pointer;
  }
  .station-row:active { background: var(--color-brand-soft); }
  .station-row.zero { background: var(--color-zero-soft); }
  .station-row.zero::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: var(--size-zero-bar);
    background: var(--color-zero);
  }
  .station-main { flex: 1; min-width: 0; }
  .station-name {
    display: block;
    font-size: var(--font-size-body);
    color: var(--color-text);
    line-height: var(--line-height-tight);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .station-sub {
    margin-top: var(--space-1);
    display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--font-size-caption);
    color: var(--color-text-muted);
  }
  .station-count {
    font-size: var(--font-size-title);
    font-weight: var(--font-weight-bold);
    color: var(--color-brand);
    line-height: var(--line-height-tight);
    white-space: nowrap;
  }
  .station-row.low .station-count { color: var(--color-low); }
  .station-row.zero .station-count { color: var(--color-zero); }
  .chevron { flex: none; color: var(--color-text-muted); }

  /* ZeroTag / LowTag */
  .tag {
    display: inline-flex; align-items: center;
    padding: 0 var(--space-2);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-caption);
    font-weight: var(--font-weight-bold);
    line-height: 20px;
  }
  .zero-tag { color: var(--color-zero); border: 1px solid var(--color-zero); }
  .low-tag { color: var(--color-low); background: var(--color-low-soft); }

  /* SkeletonRow */
  .skeleton-row {
    height: var(--size-row);
    padding: 0 var(--space-4);
    display: flex; align-items: center; gap: var(--space-3);
    border-bottom: 1px solid var(--color-border);
  }
  .skeleton-row span {
    display: block;
    background: var(--color-border);
    border-radius: var(--radius-sm);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .skeleton-row .sk-main { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); background: none; animation: none; }
  .skeleton-row .sk-line1 { width: 60%; height: 18px; }
  .skeleton-row .sk-line2 { width: 30%; height: 13px; }
  .skeleton-row .sk-count { width: 40px; height: 24px; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton-row span { animation: none; } }

  /* StateMessage */
  .state-message {
    padding: var(--space-8) var(--space-4);
    display: flex; flex-direction: column; align-items: center; gap: var(--space-4);
    text-align: center;
  }
  .state-message .title {
    margin: 0;
    font-size: var(--font-size-body);
    font-weight: var(--font-weight-bold);
    color: var(--color-text);
  }
  .state-message .body {
    margin: calc(var(--space-4) * -1 + var(--space-1)) 0 0;
    font-size: var(--font-size-sub);
    color: var(--color-text-muted);
  }
  .state-message .icon { color: var(--color-zero); }

  /* Button */
  .button {
    min-height: var(--size-touch);
    padding: 0 var(--space-6);
    border: 0; border-radius: var(--radius-md);
    background: var(--color-brand); color: var(--color-on-brand);
    font-size: var(--font-size-body); font-weight: var(--font-weight-bold);
    cursor: pointer;
  }

  /* 상세 */
  .detail { padding: var(--space-6) var(--space-4) 0; }
  .detail-name {
    margin: 0 0 var(--space-4);
    font-size: var(--font-size-title);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
  }
  .bike-count {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--space-2);
    line-height: var(--line-height-tight);
    padding-bottom: var(--space-4);
  }
  .bike-count .num {
    font-size: var(--font-size-display);
    font-weight: var(--font-weight-bold);
    color: var(--color-brand);
  }
  .bike-count.low .num { color: var(--color-low); }
  .bike-count.zero .num { color: var(--color-zero); }
  .bike-count .label { font-size: var(--font-size-body); color: var(--color-text); }
  .bike-count .tag { align-self: center; }
  .zero-note {
    margin: 0 0 var(--space-4);
    padding: var(--space-3) var(--space-4);
    background: var(--color-zero-soft);
    border-radius: var(--radius-md);
    font-size: var(--font-size-sub);
    color: var(--color-text);
  }
  .info-list { margin: 0; padding: 0; border-top: 1px solid var(--color-border); }
  .info-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--space-4) 0;
    border-bottom: 1px solid var(--color-border);
  }
  .info-row dt { font-size: var(--font-size-body); color: var(--color-text-muted); }
  .info-row dd {
    margin: 0;
    font-size: var(--font-size-title);
    font-weight: var(--font-weight-bold);
    color: var(--color-text);
  }
  .coord-text {
    margin: var(--space-4) 0 0;
    font-size: var(--font-size-caption);
    font-weight: var(--font-weight-regular);
    color: var(--color-text-muted);
  }

  /* SourceNote */
  .source-note {
    margin-top: auto;
    padding: var(--space-4);
    border-top: 1px solid var(--color-border);
    font-size: var(--font-size-caption);
    color: var(--color-text-muted);
  }
  main { flex: 1; }
</style>
</head>

<script>
(function () {
  "use strict";

  // 문구 (DESIGN.md 문구 예)
  var COPY = {
    appTitle: "따릉이 대여소 현황",
    listCount: "대여소 {n}곳",
    rowCount: "{bikes}대",
    rowRack: "거치대 {racks}개",
    zeroTag: "자전거 없음",
    lowTag: "얼마 없음",
    loading: "불러오는 중…",
    empty: "표시할 대여소가 없어요",
    emptyTitle: "‘{q}’ 이름의 대여소가 없어요",
    emptyBody: "대여소 이름 일부만 넣어 보세요. 예: 망원역",
    error: "대여소 정보를 불러오지 못했어요",
    errorBody: "인터넷 연결을 확인한 뒤 다시 시도해 주세요",
    retry: "다시 시도",
    back: "목록",
    detailCount: "{bikes}대 남음",
    detailRackValue: "{racks}개",
    detailEmptyRacks: "빈 거치대",
    statRacks: "거치대",
    zeroTitle: "지금 빌릴 자전거가 없어요",
    coords: "위도 {lat} · 경도 {lng}",
    freshness: "{month}월 {day}일 {ampm} {h}:{m} 기준",
    summaryAvailable: "자전거 있는 곳",
    summaryBikes: "남은 자전거",
    summaryZero: "자전거 없는 곳",
    search: "대여소 이름 검색",
    clearSearch: "검색어 지우기"
  };
  var LOW_MAX = 2; // 1~2대 = 얼마 없음

  function t(key, vars) {
    return COPY[key].replace(/\{(\w+)\}/g, function (_, k) { return vars[k]; });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function level(bikes) {
    if (bikes === 0) return "zero";
    if (bikes <= LOW_MAX) return "low";
    return "available";
  }
  function formatFreshness(iso) {
    // 서울 시각(UTC+9)으로 표시
    var d = new Date(new Date(iso).getTime() + 9 * 3600 * 1000);
    var h = d.getUTCHours();
    return t("freshness", {
      month: d.getUTCMonth() + 1,
      day: d.getUTCDate(),
      ampm: h < 12 ? "오전" : "오후",
      h: h % 12 === 0 ? 12 : h % 12,
      m: String(d.getUTCMinutes()).padStart(2, "0")
    });
  }

  var ICON_CHEVRON = '<svg class="chevron" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_BACK = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_CLEAR = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var ICON_ALERT = '<svg class="icon" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 11v11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="28.5" r="2" fill="currentColor"/></svg>';

  var appBar = document.getElementById("appBar");
  var view = document.getElementById("view");

  var state = { status: "loading", stations: [], fetchedAt: null, query: "" };

  // ?state=loading|empty|error 로 상태 화면을 미리 볼 수 있다.
  var forced = new URLSearchParams(location.search).get("state");

  function load() {
    state.status = "loading";
    render();

    if (forced === "loading") return;
    if (forced === "error") { setTimeout(function () { state.status = "error"; render(); }, 600); return; }
    if (forced === "empty") { setTimeout(function () { applyData({ source: {}, stations: [] }); }, 600); return; }

    var request = location.protocol === "file:"
      ? Promise.resolve(JSON.parse(document.getElementById("snapshot").textContent))
      : fetch("data/stations.json", { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        });

    request.then(applyData, function () { state.status = "error"; render(); });
  }

  function applyData(data) {
    state.stations = (data.stations || []).map(function (s) {
      return {
        id: s.stationId,
        name: s.stationName,
        bikes: Number(s.parkingBikeTotCnt) || 0,
        racks: Number(s.rackTotCnt) || 0,
        lat: s.stationLatitude,
        lng: s.stationLongitude
      };
    });
    state.fetchedAt = data.source && data.source.fetchedAt;
    state.status = "ready";
    render();
  }

  function render() {
    var id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var station = id && state.status === "ready"
      ? state.stations.find(function (s) { return s.id === id; })
      : null;
    if (station) renderDetail(station); else renderList();
  }

  /* ---------- 목록 ---------- */
  function renderList() {
    appBar.innerHTML = "<h1>" + esc(COPY.appTitle) + "</h1>";
    document.title = COPY.appTitle;

    if (state.status === "loading") {
      var sk = "";
      for (var i = 0; i < 5; i++) {
        sk += '<div class="skeleton-row" aria-hidden="true"><div class="sk-main"><span class="sk-line1"></span><span class="sk-line2"></span></div><span class="sk-count"></span></div>';
      }
      view.innerHTML = '<p class="visually-hidden">' + esc(COPY.loading) + "</p>" + sk;
      return;
    }

    if (state.status === "error") {
      view.innerHTML = stateMessage({
        icon: ICON_ALERT, title: COPY.error, body: COPY.errorBody, action: COPY.retry
      });
      view.querySelector(".button").addEventListener("click", load);
      return;
    }

    if (state.stations.length === 0) {
      view.innerHTML = stateMessage({ title: COPY.empty, action: COPY.retry });
      view.querySelector(".button").addEventListener("click", load);
      return;
    }

    var all = state.stations;
    var withBikes = all.filter(function (s) { return s.bikes > 0; }).length;
    var totalBikes = all.reduce(function (n, s) { return n + s.bikes; }, 0);
    var zeroCount = all.length - withBikes;

    view.innerHTML =
      '<section class="list-head">' +
        '<div class="list-head-row">' +
          '<h2 class="list-count" id="listCount"></h2>' +
          (state.fetchedAt ? '<span class="freshness">' + esc(formatFreshness(state.fetchedAt)) + "</span>" : "") +
        "</div>" +
        '<div class="summary">' +
          summaryCard(COPY.summaryAvailable, withBikes + "곳") +
          summaryCard(COPY.summaryBikes, totalBikes + "대") +
          summaryCard(COPY.summaryZero, zeroCount + "곳", zeroCount > 0 ? "zero" : "") +
        "</div>" +
        '<div class="search" role="search">' +
          '<label class="visually-hidden" for="q">' + esc(COPY.search) + "</label>" +
          '<input id="q" type="search" autocomplete="off" placeholder="' + esc(COPY.search) + '" value="' + esc(state.query) + '">' +
          '<button type="button" class="clear-search" aria-label="' + esc(COPY.clearSearch) + '">' + ICON_CLEAR + "</button>" +
        "</div>" +
      "</section>" +
      '<div id="results"></div>';

    var input = document.getElementById("q");
    var clear = view.querySelector(".clear-search");
    input.addEventListener("input", function () { state.query = input.value; renderResults(); });
    clear.addEventListener("click", function () { state.query = ""; input.value = ""; renderResults(); input.focus(); });
    renderResults();
  }

  function renderResults() {
    var q = state.query.trim();
    var norm = function (s) { return s.replace(/\s+/g, "").toLowerCase(); };
    var list = q
      ? state.stations.filter(function (s) { return norm(s.name).indexOf(norm(q)) !== -1; })
      : state.stations;

    document.getElementById("listCount").textContent = t("listCount", { n: list.length });
    view.querySelector(".clear-search").hidden = !state.query;

    var results = document.getElementById("results");
    if (list.length === 0) {
      results.innerHTML = stateMessage({
        title: t("emptyTitle", { q: q }), body: COPY.emptyBody, action: "전체 보기"
      });
      results.querySelector(".button").addEventListener("click", function () {
        view.querySelector(".clear-search").click();
      });
      return;
    }

    results.innerHTML = '<ul class="station-list">' + list.map(stationRow).join("") + "</ul>";
  }

  function stationRow(s) {
    var lv = level(s.bikes);
    var tag = lv === "zero" ? '<span class="tag zero-tag">' + esc(COPY.zeroTag) + "</span>"
            : lv === "low" ? '<span class="tag low-tag">' + esc(COPY.lowTag) + "</span>"
            : "";
    return '<li><a class="station-row ' + lv + '" href="#/' + encodeURIComponent(s.id) + '">' +
      '<span class="station-main">' +
        '<span class="station-name">' + esc(s.name) + "</span>" +
        '<span class="station-sub">' + tag + "<span>" + esc(t("rowRack", { racks: s.racks })) + "</span></span>" +
      "</span>" +
      '<span class="station-count">' + esc(t("rowCount", { bikes: s.bikes })) + "</span>" +
      ICON_CHEVRON +
    "</a></li>";
  }

  function summaryCard(label, value, variant) {
    return '<div class="summary-card ' + (variant || "") + '">' +
      '<span class="label">' + esc(label) + "</span>" +
      '<span class="value">' + esc(value) + "</span>" +
    "</div>";
  }

  function stateMessage(o) {
    return '<div class="state-message">' +
      (o.icon || "") +
      '<p class="title">' + esc(o.title) + "</p>" +
      (o.body ? '<p class="body">' + esc(o.body) + "</p>" : "") +
      (o.action ? '<button type="button" class="button">' + esc(o.action) + "</button>" : "") +
    "</div>";
  }

  /* ---------- 상세 ---------- */
  function renderDetail(s) {
    var lv = level(s.bikes);
    var emptyRacks = Math.max(s.racks - s.bikes, 0);
    document.title = s.name + " · " + COPY.appTitle;

    appBar.innerHTML = '<button type="button" class="back-button">' + ICON_BACK + "<span>" + esc(COPY.back) + "</span></button>";
    appBar.querySelector(".back-button").addEventListener("click", function () {
      location.hash = "";
    });

    var tag = lv === "zero" ? '<span class="tag zero-tag">' + esc(COPY.zeroTag) + "</span>"
            : lv === "low" ? '<span class="tag low-tag">' + esc(COPY.lowTag) + "</span>"
            : "";

    view.innerHTML =
      '<section class="detail">' +
        '<h1 class="detail-name">' + esc(s.name) + "</h1>" +
        '<div class="bike-count ' + lv + '">' +
          '<span class="num">' + s.bikes + "대</span>" +
          '<span class="label">남음</span>' + tag +
        "</div>" +
        (lv === "zero" ? '<p class="zero-note">' + esc(COPY.zeroTitle) + "</p>" : "") +
        '<dl class="info-list">' +
          infoRow(COPY.statRacks, t("detailRackValue", { racks: s.racks })) +
          infoRow(COPY.detailEmptyRacks, t("detailRackValue", { racks: emptyRacks })) +
        "</dl>" +
        '<p class="coord-text">' + esc(t("coords", { lat: s.lat.toFixed(5), lng: s.lng.toFixed(5) })) + "</p>" +
        (state.fetchedAt ? '<p class="coord-text" style="margin-top:var(--space-1)">' + esc(formatFreshness(state.fetchedAt)) + "</p>" : "") +
      "</section>";
    window.scrollTo(0, 0);
  }

  function infoRow(label, value) {
    return '<div class="info-row"><dt>' + esc(label) + "</dt><dd>" + esc(value) + "</dd></div>";
  }

  window.addEventListener("hashchange", render);
  load();
})();
</script>
</body>
</html>
