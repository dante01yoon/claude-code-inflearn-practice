<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>따릉이 대여소 현황</title>
<style>
  body { margin: 0; font-family: Pretendard, sans-serif; font-size: 16px; color: #1C1F1D; background: #FFFFFF; }
  h1 { margin: 0; padding: 16px; font-size: 20px; border-bottom: 1px solid #DCE2DE; }
  .row { display: flex; justify-content: space-between; min-height: 44px; padding: 0 16px; align-items: center; }
  .count { font-size: 20px; color: #1F6B3A; }
  .badge { font-size: 13px; color: #B3261E; background: #FBECEB; border-radius: 6px; padding: 0 4px; }
  .note { font-size: 13px; color: #55605A; }
  button { min-width: 44px; min-height: 44px; font: inherit; color: #FFFFFF; background: color(srgb 0.12157 0.41961 0.22745); /* #1F6B3A, written in another color format */ border: 0; border-radius: 12px; }
</style>
</head>
<body>
  <h1>대여소 17곳</h1>
  <div class="row"><span>망원역 1번출구</span><span class="count">5대</span></div>
  <div class="row"><span>합정역 7번출구</span><span class="badge">자전거 없음</span></div>
  <button type="button">다시 시도</button>
  <p class="note">출처: 서울특별시 OA-15493, 공공누리 제1유형</p>
</body>
</html>
