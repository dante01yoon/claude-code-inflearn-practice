<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>따릉이 대여소 현황</title>
<style>
  body { margin: 0; font-family: Pretendard, sans-serif; font-size: 16px; color: #1C1F1D; background: #FFFFFF; }
  .off-color { color: #333333; }
  .off-size { font-size: 15px; }
  .small { width: 32px; height: 32px; color: #FFFFFF; background: #1F6B3A; border: 0; font: inherit; }
  .hidden { display: none; color: #FF00FF; }
</style>
</head>
<body>
  <p class="off-color">대여소 17곳</p>
  <p class="off-size">거치대 10개</p>
  <button class="small" type="button" aria-label="닫기">×</button>
  <p>오류가 발생하였습니다</p>
  <p class="hidden">보이지 않는 글자</p>
</body>
</html>
