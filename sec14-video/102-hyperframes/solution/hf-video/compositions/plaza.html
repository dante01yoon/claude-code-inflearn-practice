<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Gowun Batang";
          font-weight: 700;
          src: url("../assets/fonts/gowun-batang-700.woff2") format("woff2");
        }
        @font-face {
          font-family: "Gowun Dodum";
          font-weight: 400;
          src: url("../assets/fonts/gowun-dodum-400.woff2") format("woff2");
        }
        #plaza-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #plaza-fade {
          position: absolute;
          inset: 0;
        }
        #plaza-bg {
          position: absolute;
          inset: 0;
          will-change: transform;
        }
        #plaza-bg img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        #plaza-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(27, 21, 48, 0) 40%, rgba(27, 21, 48, 0.72) 100%);
        }
        #plaza-scrim {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 45% 62% at 22% 52%, rgba(20, 14, 38, 0.86) 0%, rgba(20, 14, 38, 0.6) 55%, rgba(20, 14, 38, 0) 100%);
        }
        #plaza-motes {
          position: absolute;
          inset: 0;
        }
        #plaza-root .mote {
          position: absolute;
          border-radius: 50%;
          background: #ffd98a;
          box-shadow: 0 0 14px 4px rgba(245, 179, 74, 0.7);
          will-change: transform, opacity;
        }
        #plaza-root .glow {
          position: absolute;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(245, 179, 74, 0.9) 0%, rgba(232, 128, 40, 0.35) 38%, rgba(232, 128, 40, 0) 70%);
          mix-blend-mode: screen;
          will-change: transform, opacity;
        }
        #plaza-cat {
          position: absolute;
          right: 200px;
          bottom: -70px;
          width: 627px;
          height: 940px;
        }
        #plaza-cat-sway {
          position: absolute;
          inset: 0;
          transform-origin: 50% 100%;
        }
        #plaza-cat-sway img {
          width: 100%;
          height: 100%;
          display: block;
          filter: drop-shadow(0 30px 50px rgba(10, 6, 24, 0.65));
        }
        #plaza-cat-glow {
          left: 343px;
          top: 290px;
          width: 400px;
          height: 400px;
        }
        #plaza-root .token {
          position: absolute;
          background-size: contain;
          background-repeat: no-repeat;
          background-position: center;
          filter: drop-shadow(0 10px 16px rgba(10, 6, 24, 0.55));
          will-change: transform, opacity;
        }
        #plaza-root .coin {
          background-image: url("../assets/mooncat/props/261-paw-coin.png");
        }
        #plaza-gem {
          right: 150px;
          top: 150px;
          width: 150px;
          height: 150px;
          background-image: url("../assets/mooncat/props/262-moon-gem.png");
        }
        #plaza-coin-a { right: 820px; top: 650px; width: 130px; height: 130px; }
        #plaza-coin-b { right: 110px; top: 560px; width: 110px; height: 110px; }
        #plaza-coin-c { right: 740px; top: 870px; width: 96px; height: 96px; }
        #plaza-title {
          position: absolute;
          left: 150px;
          top: 240px;
          width: 960px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        #plaza-label {
          font-family: "Montserrat", sans-serif;
          font-weight: 600;
          font-size: 26px;
          letter-spacing: 0.32em;
          color: #f5b34a;
        }
        #plaza-root .word {
          display: block;
          font-family: "Gowun Batang", serif;
          font-weight: 700;
          font-size: 168px;
          line-height: 1.08;
          color: #fbeed6;
          text-shadow:
            0 0 40px rgba(245, 179, 74, 0.35),
            0 6px 30px rgba(20, 14, 38, 0.85);
          white-space: nowrap;
        }
        #plaza-rule {
          display: block;
          width: 300px;
          height: 4px;
          margin-top: 18px;
          background: #f5b34a;
          transform-origin: 0% 50%;
        }
        #plaza-sub {
          font-family: "Gowun Dodum", sans-serif;
          font-weight: 400;
          font-size: 48px;
          color: #fbeed6;
          text-shadow: 0 3px 18px rgba(20, 14, 38, 0.9);
          margin-top: 12px;
        }
      </style>

      <div data-hf-id="hf-fiyw" id="plaza-root" data-composition-id="plaza" data-width="1920" data-height="1080">
        <div data-hf-id="hf-bzxc" id="plaza-fade">
          <div data-hf-id="hf-d3nm" id="plaza-bg" data-layout-allow-overflow><img data-hf-id="hf-yumg" src="../assets/mooncat/backgrounds/241-lantern-station-plaza.png" alt="" /></div>
          <div data-hf-id="hf-n2gs" id="plaza-vignette"></div>
          <div data-hf-id="hf-yed8" id="plaza-scrim"></div>
          <div data-hf-id="hf-zj9q" id="plaza-motes"></div>
          <div data-hf-id="hf-t9st" id="plaza-cat" data-layout-allow-overflow>
            <div data-hf-id="hf-o7tn" id="plaza-cat-sway">
              <div data-hf-id="hf-pay4" class="glow" id="plaza-cat-glow"></div>
              <img data-hf-id="hf-mhbw" src="../assets/mooncat/characters/003_lantern_shopkeeper.png" alt="등불가게 검은 고양이" />
            </div>
          </div>
          <div data-hf-id="hf-24mr" class="token" id="plaza-gem"></div>
          <div data-hf-id="hf-c2w6" class="token coin" id="plaza-coin-a"></div>
          <div data-hf-id="hf-84s5" class="token coin" id="plaza-coin-b"></div>
          <div data-hf-id="hf-7d4c" class="token coin" id="plaza-coin-c"></div>
          <div data-hf-id="hf-vvv4" id="plaza-title">
            <div data-hf-id="hf-yz84" id="plaza-label">LANTERN SHOP · 003</div>
            <span data-hf-id="hf-75ag" class="word" id="plaza-w1">달빛 고양이</span>
            <span data-hf-id="hf-9s22" class="word" id="plaza-w2">야시장</span>
            <span data-hf-id="hf-8t1z" id="plaza-rule"></span>
            <div data-hf-id="hf-nlwf" id="plaza-sub">오늘 밤도 가게 문을 엽니다.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const DUR = 5;

          // Crossfade in over the tail of the alley scene
          tl.fromTo("#plaza-fade", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 0);

          // multi-phase-camera: gentle pull-back on the plaza
          tl.fromTo("#plaza-bg", { scale: 1.2, y: 20 }, { scale: 1.05, y: 0, duration: DUR, ease: "power1.out" }, 0);

          // Deterministic floating light motes
          const box = document.getElementById("plaza-motes");
          for (let i = 0; i < 14; i++) {
            const h = Math.abs(Math.sin((i + 1) * 12.9898 + 4.2) * 43758.5453) % 1;
            const k = Math.abs(Math.sin((i + 1) * 78.233 + 4.2) * 12345.678) % 1;
            const m = document.createElement("div");
            m.className = "mote";
            const size = Math.round(5 + ((i * 7) % 5) * 2);
            m.style.cssText = `left:${Math.round(80 + h * 1760)}px;top:${Math.round(380 + k * 640)}px;width:${size}px;height:${size}px;opacity:0`;
            box.appendChild(m);
            tl.fromTo(m, { y: 0, x: 0 }, { y: -(160 + k * 220), x: (h - 0.5) * 120, duration: DUR, ease: "none" }, 0);
            tl.fromTo(m, { opacity: 0 }, { opacity: 0.85, duration: 1.2, ease: "power1.out" }, 0.3 + (i % 5) * 0.25);
          }

          // Cat rises in; lantern blooms behind it, then breathes
          tl.fromTo("#plaza-cat", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 0.5);
          tl.fromTo("#plaza-cat-glow", { opacity: 0, scale: 0.6 }, { opacity: 0.42, scale: 1, duration: 1.1, ease: "power2.out" }, 0.7);
          tl.fromTo(
            "#plaza-cat-glow",
            { opacity: 0.42, scale: 1 },
            { opacity: 0.3, scale: 1.08, duration: 0.85, repeat: 3, yoyo: true, ease: "sine.inOut", immediateRender: false },
            1.8,
          );
          tl.fromTo("#plaza-cat-sway", { rotation: 0 }, { rotation: 1.2, duration: 1.4, repeat: 1, yoyo: true, ease: "sine.inOut" }, 1.4);

          // waterfall-entry: title stack cascades in as one beat
          tl.fromTo("#plaza-label", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.7);
          tl.fromTo("#plaza-w1", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 0.85);
          tl.fromTo("#plaza-w2", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 1.05);
          tl.fromTo("#plaza-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.5);
          tl.fromTo("#plaza-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.7);

          // spring-pop-entrance: moon gem and paw coins pop, then float
          ["#plaza-gem", "#plaza-coin-b", "#plaza-coin-a", "#plaza-coin-c"].forEach((sel, i) => {
            tl.fromTo(sel, { scale: 0, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.0 + i * 0.12);
            tl.fromTo(
              sel,
              { y: 0, rotation: 0 },
              { y: -12 - i * 2, rotation: i % 2 ? 6 : -6, duration: 0.9 + i * 0.15, repeat: 1, yoyo: true, ease: "sine.inOut", immediateRender: false },
              2.7 + i * 0.12,
            );
          });

          window.__timelines["plaza"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
