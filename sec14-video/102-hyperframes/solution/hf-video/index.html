<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1b1530;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1530;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: 비 갠 등불 골목 — 고양이 등장, 반딧불 친구 합류 -->
      <div data-hf-id="hf-qssg"
        id="alley"
        class="clip"
        data-composition-id="alley"
        data-composition-src="compositions/alley.html"
        data-start="0"
        data-duration="5.6"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: 달 뜬 역 광장 — 타이틀 (0.6s 크로스페이드로 겹침) -->
      <div data-hf-id="hf-agfr"
        id="plaza"
        class="clip"
        data-composition-id="plaza"
        data-composition-src="compositions/plaza.html"
        data-start="5"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
