<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 카페 · 주문하기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
  :root {
    --bg: #faf6f1; --card: #fff; --text: #2b2118; --muted: #7a6a5c;
    --accent: #7b4a2a; --accent-text: #fff; --line: #eadfd3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  header { padding: 28px 16px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main {
    max-width: 960px; margin: 0 auto; padding: 16px 16px 120px;
    display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start;
  }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .menu li {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: flex; align-items: center; gap: 12px;
  }
  .menu .emoji { font-size: 2rem; }
  .menu .info { flex: 1; min-width: 0; }
  .menu .name { font-weight: 700; }
  .menu .price { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .add {
    background: var(--accent); color: var(--accent-text); border: 0;
    border-radius: 10px; padding: 10px 16px; font-weight: 700; white-space: nowrap;
  }
  .add:active { transform: scale(.97); }
  .cart {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; position: sticky; top: 16px;
  }
  .cart ul { list-style: none; margin: 0; padding: 0; }
  .cart li {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .cart .item-name { flex: 1; min-width: 0; }
  .cart .item-sub { display: block; color: var(--muted); font-size: .85rem; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button, .remove {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); line-height: 1;
  }
  .qty span { min-width: 1.5em; text-align: center; font-weight: 700; }
  .empty { color: var(--muted); padding: 12px 0; margin: 0; }
  .total {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 12px; font-weight: 700; font-size: 1.15rem;
  }
  .total strong { color: var(--accent); font-size: 1.35rem; }
  .clear {
    margin-top: 12px; width: 100%; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .clear:disabled { opacity: .4; cursor: default; }
  .bar { display: none; }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    .cart { position: static; }
    .bar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0;
      justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--accent); color: var(--accent-text);
      box-shadow: 0 -4px 16px rgba(0,0,0,.15);
    }
    .bar a { color: var(--accent-text); font-weight: 700; text-decoration: none; }
    .bar strong { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<header>
  <h1>☕ 오늘의 카페</h1>
  <p>메뉴를 담으면 합계가 바로 계산돼요</p>
</header>

<main>
  <section aria-labelledby="menu-title">
    <h2 id="menu-title">메뉴</h2>
    <ul class="menu" id="menu"></ul>
  </section>

  <section class="cart" id="cart" aria-labelledby="cart-title">
    <h2 id="cart-title">장바구니</h2>
    <ul id="cart-list"></ul>
    <p class="empty" id="empty">아직 담은 메뉴가 없어요.</p>
    <div class="total">
      <span>합계</span>
      <strong id="total" aria-live="polite">0원</strong>
    </div>
    <button class="clear" id="clear" type="button">장바구니 비우기</button>
  </section>
</main>

<div class="bar" id="bar">
  <span><span id="bar-count">0</span>잔 · <strong id="bar-total">0원</strong></span>
  <a href="#cart">장바구니 보기 ↑</a>
</div>

<script>
  const MENU = [
    { id: "americano", name: "아메리카노", price: 4500, emoji: "☕" },
    { id: "latte", name: "카페라테", price: 5000, emoji: "🥛" },
    { id: "vanilla", name: "바닐라라테", price: 5500, emoji: "🍦" },
  ];
  const STORAGE_KEY = "cafe-cart";
  const won = n => n.toLocaleString("ko-KR") + "원";

  let cart = load();

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      // 메뉴에 있는 항목, 양의 정수 수량만 남긴다
      const clean = {};
      for (const m of MENU) {
        const q = Math.floor(Number(data[m.id]));
        if (q > 0) clean[m.id] = q;
      }
      return clean;
    } catch { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); } catch {}
  }

  function change(id, delta) {
    const q = (cart[id] || 0) + delta;
    if (q > 0) cart[id] = q; else delete cart[id];
    save(); renderCart();
  }

  function renderMenu() {
    document.getElementById("menu").innerHTML = MENU.map(m => `
      <li>
        <span class="emoji" aria-hidden="true">${m.emoji}</span>
        <div class="info">
          <div class="name">${m.name}</div>
          <div class="price">${won(m.price)}</div>
        </div>
        <button class="add" type="button" data-add="${m.id}">담기</button>
      </li>`).join("");
  }

  function renderCart() {
    const items = MENU.filter(m => cart[m.id]);
    const total = items.reduce((s, m) => s + m.price * cart[m.id], 0);
    const count = items.reduce((s, m) => s + cart[m.id], 0);

    document.getElementById("cart-list").innerHTML = items.map(m => `
      <li>
        <span class="item-name">${m.name}
          <span class="item-sub">${won(m.price)} × ${cart[m.id]} = ${won(m.price * cart[m.id])}</span>
        </span>
        <div class="qty">
          <button type="button" data-dec="${m.id}" aria-label="${m.name} 하나 빼기">−</button>
          <span>${cart[m.id]}</span>
          <button type="button" data-inc="${m.id}" aria-label="${m.name} 하나 더하기">+</button>
        </div>
        <button class="remove" type="button" data-del="${m.id}" aria-label="${m.name} 삭제">✕</button>
      </li>`).join("");

    document.getElementById("empty").hidden = items.length > 0;
    document.getElementById("total").textContent = won(total);
    document.getElementById("bar-total").textContent = won(total);
    document.getElementById("bar-count").textContent = count;
    document.getElementById("clear").disabled = items.length === 0;
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.add) change(b.dataset.add, 1);
    else if (b.dataset.inc) change(b.dataset.inc, 1);
    else if (b.dataset.dec) change(b.dataset.dec, -1);
    else if (b.dataset.del) change(b.dataset.del, -cart[b.dataset.del]);
    else if (b.id === "clear") { cart = {}; save(); renderCart(); }
  });

  renderMenu();
  renderCart();
</script>
</body>
</html>
