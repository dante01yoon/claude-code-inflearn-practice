<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 지하철 노선 색 안내</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --line: #e2e6eb;
    --accent: #0052a4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a;
      --card: #1c2128;
      --text: #e8ecf1;
      --muted: #9aa5b3;
      --line: #2c333d;
      --accent: #5aa0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  header, main { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 8px;
  }
  .search {
    flex: 1 1 220px; min-width: 0;
    padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  .toggle {
    padding: 10px 14px; font-size: .95rem;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); cursor: pointer;
  }
  .toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .count { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
  h2 { font-size: 1.1rem; margin: 28px 0 12px; }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    list-style: none; padding: 0; margin: 0;
  }
  .card {
    position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  .swatch {
    display: flex; align-items: flex-end; justify-content: space-between;
    width: 100%; height: 96px; padding: 12px;
    border: 0; cursor: pointer; text-align: left;
    font: inherit; font-weight: 700; font-size: 1.05rem;
  }
  .swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
  .swatch .hint { font-size: .75rem; font-weight: 500; opacity: .85; }
  .info { padding: 10px 12px 12px; }
  .name { margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px;
    font-size: .8rem; font-weight: 700;
  }
  .codes { margin: 4px 0 0; color: var(--muted); font-size: .85rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .star {
    position: absolute; top: 8px; right: 8px;
    width: 36px; height: 36px; border-radius: 18px;
    border: 0; cursor: pointer; font-size: 1.2rem; line-height: 1;
    background: rgba(255,255,255,.85); color: #444;
  }
  .star[aria-pressed="true"] { color: #e0a100; }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { max-width: 1080px; margin: 32px auto; padding: 0 16px; color: var(--muted); font-size: .8rem; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #1b1f24; color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: .9rem; opacity: 0; pointer-events: none; transition: .2s;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 480px) {
    h1 { font-size: 1.35rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .swatch { height: 80px; }
  }
</style>
</head>
<body>
<header>
  <h1>서울 지하철 노선 색 안내</h1>
  <p class="sub">노선별 대표 색입니다. 색을 누르면 HEX 코드가 복사됩니다.</p>
  <div class="toolbar">
    <input id="q" class="search" type="search" placeholder="노선 검색 (예: 2호선)" aria-label="노선 이름 검색">
    <button id="favOnly" class="toggle" type="button" aria-pressed="false">★ 즐겨찾기만</button>
  </div>
  <p id="count" class="count" aria-live="polite"></p>
</header>

<main id="list"></main>

<footer>색 값은 널리 쓰이는 노선 대표 색 기준이며, 운영 기관 자료에 따라 조금 다를 수 있습니다.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const LINES = [
  { id: "1", group: "서울 1~9호선", name: "1호선", short: "1", hex: "#0052A4" },
  { id: "2", group: "서울 1~9호선", name: "2호선", short: "2", hex: "#00A84D" },
  { id: "3", group: "서울 1~9호선", name: "3호선", short: "3", hex: "#EF7C1C" },
  { id: "4", group: "서울 1~9호선", name: "4호선", short: "4", hex: "#00A5DE" },
  { id: "5", group: "서울 1~9호선", name: "5호선", short: "5", hex: "#996CAC" },
  { id: "6", group: "서울 1~9호선", name: "6호선", short: "6", hex: "#CD7C2F" },
  { id: "7", group: "서울 1~9호선", name: "7호선", short: "7", hex: "#747F00" },
  { id: "8", group: "서울 1~9호선", name: "8호선", short: "8", hex: "#E6186C" },
  { id: "9", group: "서울 1~9호선", name: "9호선", short: "9", hex: "#BDB092" },
  { id: "gyeongui", group: "광역철도", name: "경의·중앙선", short: "경의", hex: "#77C4A3" },
  { id: "suin", group: "광역철도", name: "수인·분당선", short: "수인", hex: "#F5A200" },
  { id: "shinbundang", group: "광역철도", name: "신분당선", short: "신분", hex: "#D4003B" },
  { id: "airport", group: "광역철도", name: "공항철도", short: "공항", hex: "#0090D2" },
  { id: "gyeongchun", group: "광역철도", name: "경춘선", short: "경춘", hex: "#0C8E72" },
  { id: "gyeonggang", group: "광역철도", name: "경강선", short: "경강", hex: "#0054A6" },
  { id: "seohae", group: "광역철도", name: "서해선", short: "서해", hex: "#8FC31F" },
  { id: "gtxa", group: "광역철도", name: "GTX-A", short: "A", hex: "#9A6292" },
  { id: "ui", group: "경전철", name: "우이신설선", short: "우이", hex: "#B0CE18" },
  { id: "sillim", group: "경전철", name: "신림선", short: "신림", hex: "#6789CA" },
  { id: "gimpo", group: "경전철", name: "김포골드라인", short: "김포", hex: "#AD8605" },
  { id: "everline", group: "경전철", name: "용인에버라인", short: "에버", hex: "#509F22" },
  { id: "uijeongbu", group: "경전철", name: "의정부경전철", short: "의정", hex: "#FDA600" },
  { id: "incheon1", group: "인천 도시철도", name: "인천 1호선", short: "인1", hex: "#7CA8D5" },
  { id: "incheon2", group: "인천 도시철도", name: "인천 2호선", short: "인2", hex: "#ED8B00" },
];

const STORE_KEY = "subway-colors:favorites";
const state = { q: "", favOnly: false, favs: loadFavs() };

function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY)) || []); }
  catch { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...state.favs])); } catch {}
}

function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
// 배경색 밝기에 따라 글자색을 검정/흰색 중 대비가 큰 쪽으로 고른다
function textOn(hex) {
  const lum = rgb(hex).map(v => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  });
  const L = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2];
  return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? "#111" : "#fff";
}

function render() {
  const q = state.q.trim().replace(/\s/g, "").toLowerCase();
  const shown = LINES.filter(l =>
    (!state.favOnly || state.favs.has(l.id)) &&
    (!q || l.name.replace(/[\s·]/g, "").toLowerCase().includes(q) || l.hex.toLowerCase().includes(q))
  );

  document.getElementById("count").textContent =
    `${shown.length.toLocaleString("ko-KR")}개 노선 / 전체 ${LINES.length.toLocaleString("ko-KR")}개`;

  const list = document.getElementById("list");
  if (!shown.length) {
    list.innerHTML = `<p class="empty">${state.favOnly ? "즐겨찾기한 노선이 없습니다. ☆를 눌러 추가해 보세요." : "검색 결과가 없습니다."}</p>`;
    return;
  }

  const groups = [...new Set(shown.map(l => l.group))];
  list.innerHTML = groups.map(g => `
    <section>
      <h2>${g}</h2>
      <ul class="grid">
        ${shown.filter(l => l.group === g).map(card).join("")}
      </ul>
    </section>`).join("");
}

function card(l) {
  const fg = textOn(l.hex);
  const fav = state.favs.has(l.id);
  return `
    <li class="card">
      <button class="swatch" type="button" data-copy="${l.hex}"
        style="background:${l.hex};color:${fg}" aria-label="${l.name} 색 ${l.hex} 복사">
        <span>${l.hex}</span><span class="hint">복사</span>
      </button>
      <button class="star" type="button" data-fav="${l.id}" aria-pressed="${fav}"
        aria-label="${l.name} 즐겨찾기 ${fav ? "해제" : "추가"}">${fav ? "★" : "☆"}</button>
      <div class="info">
        <p class="name"><span class="badge" style="background:${l.hex};color:${fg}">${l.short}</span>${l.name}</p>
        <p class="codes">RGB ${rgb(l.hex).join(", ")}</p>
      </div>
    </li>`;
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

document.getElementById("list").addEventListener("click", async e => {
  const c = e.target.closest("[data-copy]");
  if (c) {
    await copy(c.dataset.copy);
    toast(`${c.dataset.copy} 복사했습니다`);
    return;
  }
  const f = e.target.closest("[data-fav]");
  if (f) {
    const id = f.dataset.fav;
    state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
    saveFavs();
    render();
  }
});

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });

const favBtn = document.getElementById("favOnly");
favBtn.addEventListener("click", () => {
  state.favOnly = !state.favOnly;
  favBtn.setAttribute("aria-pressed", state.favOnly);
  render();
});

render();
</script>
</body>
</html>
