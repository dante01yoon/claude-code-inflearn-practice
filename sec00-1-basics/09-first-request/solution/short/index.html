<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카페 메뉴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f2ea;
      --surface: #fffaf3;
      --text: #2b211a;
      --muted: #7a6a5c;
      --line: #e3d7c6;
      --accent: #8a5a32;
      --accent-soft: #f0e2d0;
      --badge: #b5462f;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1713;
        --surface: #26201b;
        --text: #f1e7da;
        --muted: #b3a291;
        --line: #3a3029;
        --accent: #d9a46c;
        --accent-soft: #3a2d22;
        --badge: #e07a5f;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1c1713;
      --surface: #26201b;
      --text: #f1e7da;
      --muted: #b3a291;
      --line: #3a3029;
      --accent: #d9a46c;
      --accent-soft: #3a2d22;
      --badge: #e07a5f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

    header { text-align: center; padding: 56px 0 28px; }
    header .eyebrow {
      font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--accent); font-weight: 700;
    }
    header h1 {
      font-family: "Gowun Batang", serif;
      font-size: clamp(34px, 7vw, 52px);
      margin: 8px 0 6px;
    }
    header p { color: var(--muted); margin: 0; }

    nav {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .tabs {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 12px 0; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button {
      flex: none;
      font: inherit; font-size: 15px; font-weight: 500;
      padding: 8px 16px; border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent; color: var(--muted);
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      background: var(--accent); border-color: var(--accent); color: var(--surface);
    }

    section { padding: 32px 0 8px; }
    section h2 {
      font-family: "Gowun Batang", serif;
      font-size: 26px; margin: 0 0 4px;
    }
    section .desc { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

    .item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .item .top { display: flex; align-items: baseline; gap: 8px; }
    .item .name { font-weight: 700; font-size: 17px; }
    .item .dots { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-4px); }
    .item .price { font-weight: 700; color: var(--accent); white-space: nowrap; }
    .item .en { color: var(--muted); font-size: 13px; }
    .item .note { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--badge);
      vertical-align: middle;
    }

    .options {
      margin-top: 40px; padding: 20px;
      border-radius: 14px; background: var(--accent-soft);
      font-size: 14px;
    }
    .options h3 { margin: 0 0 8px; font-size: 16px; }
    .options ul { margin: 0; padding-left: 18px; color: var(--muted); }

    footer {
      text-align: center; color: var(--muted); font-size: 13px;
      padding: 40px 0 56px;
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="eyebrow">Coffee &amp; Bakery</div>
    <h1>오늘의 카페</h1>
    <p>매일 아침 직접 로스팅한 원두로 내립니다</p>
  </header>

  <nav>
    <div class="wrap tabs" role="tablist" id="tabs"></div>
  </nav>

  <main class="wrap" id="menu"></main>

  <div class="wrap">
    <div class="options">
      <h3>옵션 안내</h3>
      <ul>
        <li>샷 추가 +500원 · 시럽 추가 +500원</li>
        <li>오트 / 두유 변경 +700원</li>
        <li>사이즈업(Large) +800원</li>
      </ul>
    </div>
  </div>

  <footer class="wrap">
    영업시간 매일 08:00 – 21:00 · 라스트 오더 20:30
  </footer>

  <script>
    const MENU = [
      {
        id: "coffee", title: "커피", desc: "싱글 오리진 & 하우스 블렌드",
        items: [
          { name: "아메리카노", en: "Americano", price: 4000 },
          { name: "카페 라떼", en: "Caffè Latte", price: 4500 },
          { name: "바닐라 라떼", en: "Vanilla Latte", price: 5000, note: "직접 만든 바닐라빈 시럽" },
          { name: "카푸치노", en: "Cappuccino", price: 4500 },
          { name: "플랫 화이트", en: "Flat White", price: 5000 },
          { name: "아인슈페너", en: "Einspänner", price: 5500, badge: "시그니처", note: "진한 커피 위 달콤한 크림" },
          { name: "콜드브루", en: "Cold Brew", price: 5000, note: "12시간 저온 추출" },
          { name: "핸드드립", en: "Hand Drip", price: 6000, note: "오늘의 원두는 직원에게 문의해 주세요" },
        ],
      },
      {
        id: "non-coffee", title: "논커피", desc: "커피 대신 즐기는 음료",
        items: [
          { name: "말차 라떼", en: "Matcha Latte", price: 5500 },
          { name: "초코 라떼", en: "Chocolate Latte", price: 5000 },
          { name: "고구마 라떼", en: "Sweet Potato Latte", price: 5500, badge: "시즌" },
          { name: "밀크티", en: "Milk Tea", price: 5500 },
        ],
      },
      {
        id: "tea", title: "티 & 에이드", desc: "상큼하고 가벼운 한 잔",
        items: [
          { name: "얼그레이", en: "Earl Grey", price: 4500 },
          { name: "캐모마일", en: "Chamomile", price: 4500 },
          { name: "유자차", en: "Yuja Tea", price: 5000 },
          { name: "레몬 에이드", en: "Lemonade", price: 5500 },
          { name: "자몽 에이드", en: "Grapefruit Ade", price: 5500, badge: "인기" },
        ],
      },
      {
        id: "dessert", title: "디저트", desc: "매일 아침 매장에서 굽습니다",
        items: [
          { name: "크루아상", en: "Croissant", price: 3800 },
          { name: "소금빵", en: "Salt Bread", price: 3000, badge: "인기" },
          { name: "바스크 치즈케이크", en: "Basque Cheesecake", price: 6500 },
          { name: "티라미수", en: "Tiramisu", price: 6500 },
          { name: "스콘", en: "Scone", price: 3500, note: "플레인 / 블루베리" },
        ],
      },
    ];

    const won = n => n.toLocaleString("ko-KR") + "원";
    const tabs = document.getElementById("tabs");
    const main = document.getElementById("menu");

    MENU.forEach((cat, i) => {
      const btn = document.createElement("button");
      btn.textContent = cat.title;
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", i === 0);
      btn.onclick = () => document.getElementById(cat.id)
        .scrollIntoView({ behavior: "smooth", block: "start" });
      btn.dataset.target = cat.id;
      tabs.appendChild(btn);

      const sec = document.createElement("section");
      sec.id = cat.id;
      sec.style.scrollMarginTop = "64px";
      sec.innerHTML = `
        <h2>${cat.title}</h2>
        <p class="desc">${cat.desc}</p>
        <div class="grid">
          ${cat.items.map(it => `
            <div class="item">
              <div class="top">
                <span class="name">${it.name}</span>
                ${it.badge ? `<span class="badge">${it.badge}</span>` : ""}
                <span class="dots"></span>
                <span class="price">${won(it.price)}</span>
              </div>
              <div class="en">${it.en}</div>
              ${it.note ? `<p class="note">${it.note}</p>` : ""}
            </div>`).join("")}
        </div>`;
      main.appendChild(sec);
    });

    // 스크롤 위치에 따라 현재 카테고리 탭 강조
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        tabs.querySelectorAll("button").forEach(b =>
          b.setAttribute("aria-selected", b.dataset.target === e.target.id));
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll("section").forEach(s => observer.observe(s));
  </script>
</body>
</html>
