<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역별 하루 평균 승차</title>
<style>
  :root {
    --surface: #10131a;
    --text-primary: #e8e6df;
    --text-secondary: #b4b2aa;
    --text-muted: #8a8880;
    --grid: #262a33;
    --series-on: #3987e5;  /* 승차 */
  }
  body { font-family: system-ui, sans-serif; background: var(--surface); color: var(--text-primary); margin: 40px; }
  h1 { font-size: 28px; }
  .note { color: var(--text-muted); font-size: 13px; }
  .stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 24px; }
  .station { border: 1px solid var(--grid); border-radius: 12px; padding: 24px; }
  .station h2 { font-size: 32px; margin: 0; }
  .station .value { font-size: 48px; font-weight: 700; color: var(--series-on); font-variant-numeric: tabular-nums; margin-top: 16px; line-height: 1.1; }
  .station .unit { font-size: 20px; font-weight: 600; color: var(--text-secondary); margin-left: 4px; }
  .station .label { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 40px; }
  @media (max-width: 600px) { body { margin: 16px; } .station .value { font-size: 40px; } }
</style>
</head>
<body>
<h1>역별 하루 평균 승차</h1>
<p class="note">2026년 7월 한 달 승차 합계를 31일로 나눈 값입니다.</p>
<div class="stations" id="stations"></div>
<footer>출처: 서울특별시 서울 열린데이터광장(CardSubwayTime), 공공누리 제1유형</footer>
<script type="module">
// 운행 하루는 04시에 시작해서 다음 날 03시에 끝난다.
const HOURS = [...Array(24)].map((_, i) => (i + 4) % 24);
const DAYS = 31; // 2026년 7월 일수
const fmt = (n) => n.toLocaleString("ko-KR");
const box = document.getElementById("stations");

fetch("data/subway-hourly-202607.json")
  .then((r) => r.json())
  .then((d) => {
    for (const row of d.CardSubwayTime.row) {
      const daily = Math.round(HOURS.reduce((a, h) => a + row[`HR_${h}_GET_ON_NOPE`], 0) / DAYS);
      const card = document.createElement("div");
      card.className = "station";
      card.innerHTML = `<h2>${row.STTN}</h2>
        <div class="value">${fmt(daily)}<span class="unit">명</span></div>
        <div class="label">하루 평균 승차</div>`;
      box.append(card);
    }
  })
  .catch(() => {
    box.textContent = "데이터를 불러오지 못했습니다. python3 -m http.server로 띄운 뒤 http://로 열어 주세요.";
  });
</script>
</body>
</html>
