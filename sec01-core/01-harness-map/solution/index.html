<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 라이브 3D</title>
<style>
  :root {
    --surface: #10131a;
    --text-primary: #e8e6df;
    --text-secondary: #b4b2aa;
    --text-muted: #8a8880;
    --grid: #262a33;
    --series-on: #3987e5;  /* 승차 */
    --series-off: #d95926; /* 하차 */
  }
  body { font-family: system-ui, sans-serif; background: var(--surface); color: var(--text-primary); margin: 40px; }
  h1 { font-size: 28px; }
  h2 { font-size: 20px; margin-top: 40px; }
  table { border-collapse: collapse; margin-top: 16px; }
  td, th { border: 1px solid #333; padding: 6px 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .legend { display: flex; gap: 20px; color: var(--text-secondary); font-size: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key { width: 16px; height: 2px; border-radius: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; margin-top: 16px; }
  .card h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .card text { fill: var(--text-muted); font-size: 11px; }
  .tip { position: fixed; pointer-events: none; background: #1d212b; border: 1px solid #333; border-radius: 6px;
         padding: 6px 10px; font-size: 13px; line-height: 1.5; display: none; white-space: nowrap; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tip b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
  @media (max-width: 600px) { body { margin: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>서울 라이브 3D</h1>
<p>2026년 7월 한 달 동안 역별 승하차 인원 (합계)</p>

<h2>시간대별 승하차</h2>
<div class="legend">
  <span><i class="key" style="background: var(--series-on)"></i>승차</span>
  <span><i class="key" style="background: var(--series-off)"></i>하차</span>
</div>
<p style="color: var(--text-muted); font-size: 13px">모든 역이 같은 세로 눈금을 씁니다. 04시부터 다음 날 03시까지, 해당 시간대 한 달 합계.</p>
<div class="grid" id="charts"></div>
<div class="tip" id="tip"></div>

<h2>역별 합계</h2>
<table id="t"><tr><th>호선</th><th>역</th><th>승차</th><th>하차</th></tr></table>
<script>
// 운행 하루는 04시에 시작해서 다음 날 03시에 끝난다.
const HOURS = [...Array(24)].map((_, i) => (i + 4) % 24);
const W = 340, H = 180, M = { top: 10, right: 8, bottom: 22, left: 40 };
const fmt = (n) => n.toLocaleString();
const compact = (n) => (n >= 1000 ? `${n / 1000}K` : `${n}`);

function niceMax(v) {
  const step = 10 ** Math.floor(Math.log10(v));
  return Math.ceil(v / step) * step;
}

function drawChart(row, yMax) {
  const on = HOURS.map((h) => row[`HR_${h}_GET_ON_NOPE`]);
  const off = HOURS.map((h) => row[`HR_${h}_GET_OFF_NOPE`]);
  const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
  const x = (i) => M.left + (i / (HOURS.length - 1)) * iw;
  const y = (v) => M.top + ih - (v / yMax) * ih;
  const path = (vals) => vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");

  let grid = "";
  for (let k = 0; k <= 4; k++) {
    const v = (yMax / 4) * k;
    grid += `<line x1="${M.left}" x2="${W - M.right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
             <text x="${M.left - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  }
  let ticks = "";
  HOURS.forEach((h, i) => {
    if (i % 4 === 0) ticks += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${String(h).padStart(2, "0")}시</text>`;
  });

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h3>${row.STTN} <span style="color: var(--text-muted); font-weight: 400">${row.SBWY_ROUT_LN_NM}</span></h3>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${row.STTN} 시간대별 승하차">
      ${grid}${ticks}
      <line class="cross" y1="${M.top}" y2="${M.top + ih}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>
      <path d="${path(off)}" fill="none" stroke="var(--series-off)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${path(on)}" fill="none" stroke="var(--series-on)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="d-off" r="4" fill="var(--series-off)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <circle class="d-on" r="4" fill="var(--series-on)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
      <rect x="${M.left}" y="${M.top}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>`;
  document.getElementById("charts").append(card);

  const svg = card.querySelector("svg");
  const cross = svg.querySelector(".cross"), dOn = svg.querySelector(".d-on"), dOff = svg.querySelector(".d-off");
  const tip = document.getElementById("tip");
  const hide = () => { tip.style.display = "none"; [cross, dOn, dOff].forEach((e) => e.setAttribute("visibility", "hidden")); };
  svg.addEventListener("pointermove", (e) => {
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
    if (p.x < M.left || p.x > W - M.right) return hide();
    const i = Math.round(((p.x - M.left) / iw) * (HOURS.length - 1));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i));
    dOn.setAttribute("cx", x(i)); dOn.setAttribute("cy", y(on[i]));
    dOff.setAttribute("cx", x(i)); dOff.setAttribute("cy", y(off[i]));
    [cross, dOn, dOff].forEach((el) => el.setAttribute("visibility", "visible"));
    const h = HOURS[i];
    tip.innerHTML = `<div>${row.STTN} · ${String(h).padStart(2, "0")}시대</div>
      <div class="row"><i class="dot" style="background: var(--series-on)"></i>승차<b>${fmt(on[i])}</b></div>
      <div class="row"><i class="dot" style="background: var(--series-off)"></i>하차<b>${fmt(off[i])}</b></div>`;
    tip.style.display = "block";
    const left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = `${left}px`;
    tip.style.top = `${e.clientY + 14}px`;
  });
  svg.addEventListener("pointerleave", hide);
}

fetch("data/subway-hourly-202607.json")
  .then((r) => r.json())
  .then((d) => {
    const rows = d.CardSubwayTime.row;
    let peak = 0;
    for (const row of rows) {
      for (const h of HOURS) peak = Math.max(peak, row[`HR_${h}_GET_ON_NOPE`], row[`HR_${h}_GET_OFF_NOPE`]);
    }
    const yMax = niceMax(peak);
    for (const row of rows) {
      drawChart(row, yMax);
      let on = 0, off = 0;
      for (const h of HOURS) {
        on += row[`HR_${h}_GET_ON_NOPE`];
        off += row[`HR_${h}_GET_OFF_NOPE`];
      }
      document.getElementById("t").insertAdjacentHTML("beforeend",
        `<tr><td>${row.SBWY_ROUT_LN_NM}</td><td>${row.STTN}</td><td class="num">${fmt(on)}</td><td class="num">${fmt(off)}</td></tr>`);
    }
  });
</script>
</body>
</html>
