<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #6b7280;
    --border: #e3e6ec;
    --accent: #2f6fed;
    --danger: #d64545;
    --c0: #3b82f6; --c1: #f59e0b; --c2: #10b981; --c3: #ec4899;
    --c4: #8b5cf6; --c5: #ef4444; --c6: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1c212b; --text: #e8ebf2; --muted: #98a1b3;
      --border: #2d3442; --accent: #5b8cff; --danger: #ff6b6b;
      --c0: #60a5fa; --c1: #fbbf24; --c2: #34d399; --c3: #f472b6;
      --c4: #a78bfa; --c5: #f87171; --c6: #9ca3af;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  form { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; min-width: 0;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 8px 0 0; }
  .chart-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  svg { width: 220px; height: 220px; flex: none; }
  .ring { fill: none; stroke-width: 26; transition: stroke-width .15s; }
  .ring.hl { stroke-width: 32; }
  .ring.dim { opacity: .35; }
  .track { fill: none; stroke: var(--border); stroke-width: 26; }
  .center-label { fill: var(--muted); font-size: 11px; text-anchor: middle; }
  .center-value { fill: var(--text); font-size: 17px; font-weight: 700; text-anchor: middle; }
  .legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 220px; }
  .legend li {
    display: grid; grid-template-columns: 12px 1fr auto 48px; gap: 8px; align-items: center;
    padding: 6px 4px; border-radius: 6px; font-size: 14px;
  }
  .legend li.hl { background: var(--bg); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pct { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; margin: 0; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  ul.list li:first-child { border-top: 0; }
  .meta { font-size: 12px; color: var(--muted); }
  .del { cursor: pointer; color: var(--muted); padding: 4px 8px; background: transparent; }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  @media (max-width: 640px) {
    form { grid-template-columns: 1fr 1fr; }
    form button { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main>
  <h1>가계부</h1>

  <section class="card">
    <form id="form" autocomplete="off">
      <label>날짜<input type="date" id="date" required></label>
      <label>카테고리<select id="category"></select></label>
      <label>금액(원)<input type="number" id="amount" min="1" step="1" inputmode="numeric" placeholder="0"></label>
      <label>메모<input type="text" id="memo" maxlength="40" placeholder="선택"></label>
      <button class="primary" type="submit">추가</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section class="card">
    <h2>카테고리별 지출</h2>
    <div id="chart"></div>
  </section>

  <section class="card">
    <h2>지출 내역</h2>
    <div id="list"></div>
  </section>
</main>

<script>
const CATEGORIES = ['식비', '교통', '주거', '쇼핑', '여가', '의료', '기타'];
const KEY = 'budget-entries';
const won = n => n.toLocaleString('ko-KR') + '원';

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch {}
}

let entries = load();
let hover = null;

const $ = id => document.getElementById(id);
const colorOf = cat => `var(--c${CATEGORIES.indexOf(cat)})`;

function today() {
  const d = new Date();
  return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderChart() {
  const totals = CATEGORIES.map(c => ({
    cat: c, sum: entries.filter(e => e.category === c).reduce((a, e) => a + e.amount, 0)
  })).filter(t => t.sum > 0).sort((a, b) => b.sum - a.sum);
  const total = totals.reduce((a, t) => a + t.sum, 0);

  if (!total) {
    $('chart').innerHTML = '<p class="empty">아직 기록이 없어요. 첫 지출을 추가해 보세요.</p>';
    return;
  }

  const R = 80, C = 2 * Math.PI * R;
  let offset = 0;
  const rings = totals.map(t => {
    const len = t.sum / total * C;
    const cls = hover ? (hover === t.cat ? 'ring hl' : 'ring dim') : 'ring';
    const el = `<circle class="${cls}" data-cat="${t.cat}" cx="110" cy="110" r="${R}"
      stroke="${colorOf(t.cat)}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 110 110)"><title>${t.cat} ${won(t.sum)} (${Math.round(t.sum / total * 100)}%)</title></circle>`;
    offset += len;
    return el;
  }).join('');

  const legend = totals.map(t => `
    <li data-cat="${t.cat}" class="${hover === t.cat ? 'hl' : ''}">
      <span class="dot" style="background:${colorOf(t.cat)}"></span>
      <span>${t.cat}</span>
      <span class="num">${won(t.sum)}</span>
      <span class="num pct">${Math.round(t.sum / total * 100)}%</span>
    </li>`).join('');

  $('chart').innerHTML = `
    <div class="chart-wrap">
      <svg viewBox="0 0 220 220" role="img" aria-label="카테고리별 지출 도넛 차트">
        <circle class="track" cx="110" cy="110" r="${R}"/>
        ${rings}
        <text class="center-label" x="110" y="106">총 지출</text>
        <text class="center-value" x="110" y="126">${won(total)}</text>
      </svg>
      <ul class="legend">${legend}</ul>
    </div>`;
}

function renderList() {
  if (!entries.length) {
    $('list').innerHTML = '<p class="empty">내역이 없습니다.</p>';
    return;
  }
  const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  $('list').innerHTML = '<ul class="list">' + sorted.map(e => `
    <li>
      <span class="dot" style="background:${colorOf(e.category)}"></span>
      <div>${esc(e.category)}${e.memo ? ' · ' + esc(e.memo) : ''}<div class="meta">${esc(e.date)}</div></div>
      <strong class="num">${won(e.amount)}</strong>
      <button class="del" data-id="${e.id}" aria-label="삭제">✕</button>
    </li>`).join('') + '</ul>';
}

function render() { renderChart(); renderList(); }

$('category').innerHTML = CATEGORIES.map(c => `<option>${c}</option>`).join('');
$('date').value = today();

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const amount = Math.floor(Number($('amount').value));
  if (!(amount > 0)) { $('error').textContent = '금액을 1원 이상으로 입력해 주세요.'; return; }
  if (!$('date').value) { $('error').textContent = '날짜를 선택해 주세요.'; return; }
  $('error').textContent = '';
  entries.push({
    id: Date.now(), date: $('date').value, category: $('category').value,
    amount, memo: $('memo').value.trim()
  });
  save();
  $('amount').value = ''; $('memo').value = '';
  $('amount').focus();
  render();
});

$('list').addEventListener('click', ev => {
  const btn = ev.target.closest('.del');
  if (!btn) return;
  entries = entries.filter(e => e.id !== Number(btn.dataset.id));
  save();
  render();
});

$('chart').addEventListener('mouseover', ev => {
  const t = ev.target.closest('[data-cat]');
  const cat = t ? t.dataset.cat : null;
  if (cat !== hover) { hover = cat; renderChart(); }
});
$('chart').addEventListener('mouseleave', () => {
  if (hover) { hover = null; renderChart(); }
});

render();
</script>
</body>
</html>
