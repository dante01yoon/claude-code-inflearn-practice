<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f3f1;
    --surface-1: #fcfcfb;
    --border: #e2e1dd;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8984;
    --accent: #2a78d6;
    --danger: #c43c3b;
    --empty-ring: #e6e5e1;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #6250d6;
    --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --accent: #3987e5;
      --danger: #e66767;
      --empty-ring: #2c2c2a;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; }
  h2 { font-size: 1.05rem; margin: 0 0 14px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* 입력 폼 */
  form { display: grid; grid-template-columns: 1fr 1fr 1fr 2fr auto; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--text-secondary); }
  input, select, button { font: inherit; font-size: 0.95rem; }
  input, select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text-primary);
    min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 0.85rem; margin: 8px 0 0; min-height: 1.2em; }

  /* 필터 */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar h2 { margin: 0; }
  .filter { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-secondary); }
  .filter label { flex-direction: row; align-items: center; font-size: 0.9rem; }

  /* 차트 */
  .chart-wrap { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .donut { position: relative; width: 240px; height: 240px; flex: none; }
  .donut svg { width: 100%; height: 100%; display: block; }
  .donut circle.seg { cursor: pointer; transition: stroke-width 0.15s; }
  .donut circle.seg:hover, .donut circle.seg:focus { stroke-width: 34; outline: none; }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
  }
  .center .label { font-size: 0.8rem; color: var(--text-secondary); }
  .center .value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .center .hint { font-size: 0.85rem; color: var(--text-muted); padding: 0 40px; }

  .legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 220px; }
  .legend li {
    display: grid; grid-template-columns: 12px 1fr auto 52px; gap: 10px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem;
  }
  .legend li:last-child { border-bottom: none; }
  .chip { width: 12px; height: 12px; border-radius: 3px; }
  .legend .amt { font-variant-numeric: tabular-nums; }
  .legend .pct { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none; white-space: nowrap;
  }
  .tooltip .t-head { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .tooltip .t-body { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  /* 목록 */
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.memo { color: var(--text-secondary); word-break: break-all; }
  .cat { display: inline-flex; align-items: center; gap: 6px; }
  .cat .chip { width: 10px; height: 10px; }
  button.del {
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    border-radius: 6px; padding: 3px 8px; font-size: 0.8rem; cursor: pointer;
  }
  button.del:hover { color: var(--danger); border-color: var(--danger); }
  .empty { color: var(--text-muted); text-align: center; padding: 20px 0; }

  @media (max-width: 720px) {
    form { grid-template-columns: 1fr 1fr; }
    form .memo-field { grid-column: 1 / -1; }
    form button.primary { grid-column: 1 / -1; }
    .chart-wrap { justify-content: center; }
    th.memo-col, td.memo { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>가계부</h1>

  <section class="card">
    <h2>지출 추가</h2>
    <form id="form" novalidate>
      <label>날짜
        <input type="date" id="date" required>
      </label>
      <label>카테고리
        <select id="category"></select>
      </label>
      <label>금액 (원)
        <input type="number" id="amount" min="1" step="1" inputmode="numeric" placeholder="0" required>
      </label>
      <label class="memo-field">메모
        <input type="text" id="memo" maxlength="50" placeholder="선택 입력">
      </label>
      <button type="submit" class="primary">추가</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2 id="period-title">카테고리별 지출</h2>
      <div class="filter">
        <input type="month" id="month" aria-label="조회할 달">
        <label><input type="checkbox" id="all-time"> 전체 기간</label>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="donut">
        <svg viewBox="0 0 240 240" id="donut" role="img" aria-label="카테고리별 지출 도넛 차트"></svg>
        <div class="center" id="center"></div>
      </div>
      <ul class="legend" id="legend"></ul>
    </div>
  </section>

  <section class="card">
    <h2>지출 내역</h2>
    <table>
      <thead>
        <tr><th>날짜</th><th>카테고리</th><th class="memo-col">메모</th><th class="num">금액</th><th></th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </section>
</main>

<div class="tooltip" id="tooltip"></div>

<script>
  const STORAGE_KEY = 'budget.expenses.v1';
  // 카테고리마다 색을 고정한다 (순위에 따라 색이 바뀌지 않도록)
  const CATEGORIES = [
    { name: '식비',     color: 'var(--series-1)' },
    { name: '교통',     color: 'var(--series-2)' },
    { name: '주거',     color: 'var(--series-3)' },
    { name: '쇼핑',     color: 'var(--series-4)' },
    { name: '문화/여가', color: 'var(--series-5)' },
    { name: '의료',     color: 'var(--series-6)' },
    { name: '교육',     color: 'var(--series-7)' },
    { name: '기타',     color: 'var(--series-8)' },
  ];
  const colorOf = name => (CATEGORIES.find(c => c.name === name) || CATEGORIES[7]).color;

  const $ = id => document.getElementById(id);
  const won = n => '₩' + n.toLocaleString('ko-KR');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function pad(n) { return String(n).padStart(2, '0'); }
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  }

  let expenses = load();

  // ---- 초기화 ----
  for (const c of CATEGORIES) {
    const opt = document.createElement('option');
    opt.value = opt.textContent = c.name;
    $('category').appendChild(opt);
  }
  $('date').value = today();
  $('month').value = today().slice(0, 7);

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const date = $('date').value;
    const amount = Number($('amount').value);
    if (!date) return showError('날짜를 입력해 주세요.');
    if (!Number.isInteger(amount) || amount <= 0) return showError('금액은 1원 이상의 정수로 입력해 주세요.');
    showError('');
    expenses.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date,
      category: $('category').value,
      amount,
      memo: $('memo').value.trim(),
    });
    save();
    // 추가한 지출이 보이도록 해당 달로 이동
    if (!$('all-time').checked) $('month').value = date.slice(0, 7);
    $('amount').value = '';
    $('memo').value = '';
    $('amount').focus();
    render();
  });

  $('month').addEventListener('change', render);
  $('all-time').addEventListener('change', () => {
    $('month').disabled = $('all-time').checked;
    render();
  });

  $('list').addEventListener('click', e => {
    const btn = e.target.closest('button.del');
    if (!btn) return;
    expenses = expenses.filter(x => x.id !== btn.dataset.id);
    save();
    render();
  });

  function showError(msg) { $('error').textContent = msg; }

  function visibleExpenses() {
    if ($('all-time').checked) return expenses;
    const m = $('month').value;
    return m ? expenses.filter(x => x.date.startsWith(m)) : expenses;
  }

  // ---- 렌더링 ----
  function render() {
    const items = visibleExpenses();
    const total = items.reduce((s, x) => s + x.amount, 0);
    const sums = CATEGORIES
      .map(c => ({ ...c, amount: items.filter(x => x.category === c.name).reduce((s, x) => s + x.amount, 0) }))
      .filter(c => c.amount > 0);

    const m = $('month').value;
    $('period-title').textContent = $('all-time').checked || !m
      ? '카테고리별 지출 · 전체 기간'
      : `카테고리별 지출 · ${m.slice(0, 4)}년 ${Number(m.slice(5))}월`;

    renderDonut(sums, total);
    renderLegend(sums, total);
    renderList(items);
  }

  function renderDonut(sums, total) {
    const svg = $('donut');
    svg.replaceChildren();
    const R = 90, W = 28, C = 2 * Math.PI * R;
    const GAP = sums.length > 1 ? 2 : 0;

    const base = document.createElementNS(SVG_NS, 'circle');
    base.setAttribute('cx', 120); base.setAttribute('cy', 120); base.setAttribute('r', R);
    base.setAttribute('fill', 'none');
    base.setAttribute('stroke', 'var(--empty-ring)');
    base.setAttribute('stroke-width', W);
    svg.appendChild(base);

    let offset = 0;
    for (const s of sums) {
      const len = (s.amount / total) * C;
      const pct = (s.amount / total) * 100;
      const circle = document.createElementNS(SVG_NS, 'circle');
      circle.classList.add('seg');
      circle.setAttribute('cx', 120); circle.setAttribute('cy', 120); circle.setAttribute('r', R);
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', s.color);
      circle.setAttribute('stroke-width', W);
      circle.setAttribute('stroke-dasharray', `${Math.max(len - GAP, 0.5)} ${C}`);
      circle.setAttribute('stroke-dashoffset', -offset);
      circle.setAttribute('transform', 'rotate(-90 120 120)');
      circle.setAttribute('tabindex', '0');
      circle.setAttribute('aria-label', `${s.name} ${won(s.amount)} (${pct.toFixed(1)}%)`);
      circle.addEventListener('pointermove', e => showTip(s, pct, e.clientX, e.clientY));
      circle.addEventListener('pointerleave', hideTip);
      circle.addEventListener('focus', () => {
        const r = circle.getBoundingClientRect();
        showTip(s, pct, r.left + r.width / 2, r.top + r.height / 2);
      });
      circle.addEventListener('blur', hideTip);
      svg.appendChild(circle);
      offset += len;
    }

    const center = $('center');
    center.replaceChildren();
    if (total === 0) {
      center.appendChild(el('div', 'hint', '지출을 추가해 보세요'));
    } else {
      center.appendChild(el('div', 'label', '총 지출'));
      center.appendChild(el('div', 'value', won(total)));
    }
  }

  function renderLegend(sums, total) {
    const ul = $('legend');
    ul.replaceChildren();
    for (const s of [...sums].sort((a, b) => b.amount - a.amount)) {
      const li = document.createElement('li');
      const chip = el('span', 'chip');
      chip.style.background = s.color;
      li.append(chip, el('span', '', s.name), el('span', 'amt', won(s.amount)),
        el('span', 'pct', ((s.amount / total) * 100).toFixed(1) + '%'));
      ul.appendChild(li);
    }
  }

  function renderList(items) {
    const tbody = $('list');
    tbody.replaceChildren();
    if (items.length === 0) {
      const tr = document.createElement('tr');
      const td = el('td', 'empty', '기록된 지출이 없습니다.');
      td.colSpan = 5;
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    const sorted = [...items].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    for (const x of sorted) {
      const tr = document.createElement('tr');
      const cat = el('span', 'cat');
      const chip = el('span', 'chip');
      chip.style.background = colorOf(x.category);
      cat.append(chip, document.createTextNode(x.category));
      const catTd = document.createElement('td');
      catTd.appendChild(cat);
      const del = el('button', 'del', '삭제');
      del.type = 'button';
      del.dataset.id = x.id;
      del.setAttribute('aria-label', `${x.date} ${x.category} ${won(x.amount)} 삭제`);
      const delTd = document.createElement('td');
      delTd.className = 'num';
      delTd.appendChild(del);
      tr.append(el('td', '', x.date), catTd, el('td', 'memo', x.memo || ''), el('td', 'num', won(x.amount)), delTd);
      tbody.appendChild(tr);
    }
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // ---- 툴팁 ----
  const tip = $('tooltip');
  function showTip(s, pct, x, y) {
    tip.replaceChildren();
    const head = el('div', 't-head');
    const chip = el('span', 'chip');
    chip.style.cssText = `background:${s.color};width:10px;height:10px;border-radius:3px;display:inline-block`;
    head.append(chip, document.createTextNode(s.name));
    tip.append(head, el('div', 't-body', `${won(s.amount)} · ${pct.toFixed(1)}%`));
    tip.style.display = 'block';
    const { width, height } = tip.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + width > innerWidth - 8) left = x - width - 14;
    if (top + height > innerHeight - 8) top = y - height - 14;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }

  render();
</script>
</body>
</html>
